version: 2

builds:
  - main: .
    binary: codex-profiles
    ldflags:
      - -s -w -X github.com/kazuki-kanaya/codex-profiles/internal/version.Version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

homebrew_casks:
  - name: codex-profiles
    binaries:
      - codex-profiles
    homepage: https://github.com/kazuki-kanaya/codex-profiles
    description: Run Codex CLI with multiple accounts simultaneously
    repository:
      owner: kazuki-kanaya
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
